<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Pênalti - BLIB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{margin:0;height:100%;background:#12331f;font-family:'Trebuchet MS',sans-serif;color:#fff;overflow:hidden}
#w{width:min(100vw,calc((100vh - 46px)*1.6));margin:0 auto}
#bar{display:flex;gap:8px;align-items:center;justify-content:space-between;height:46px;font-weight:bold;font-size:15px;white-space:nowrap}
.b{background:#ffd43b;color:#222;border:0;border-radius:18px;padding:8px 14px;font:inherit;text-decoration:none;cursor:pointer;display:inline-block;margin:4px}
canvas{width:100%;display:block;border-radius:10px;touch-action:none;cursor:crosshair}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5}#ov.on{display:flex}
.bx{background:#1f5a34;border-radius:20px;padding:20px;width:min(92vw,420px);text-align:center;max-height:92vh;overflow:auto}
.bx input{font:inherit;font-size:20px;padding:10px;border-radius:12px;border:0;width:80%;text-align:center;margin:8px 0}
ol{text-align:left;font-size:18px;padding-left:34px}
</style></head><body>
<div id="w"><div id="bar"><a class="b" href="./index.html">← Voltar ao BLIB</a><span id="inf"></span></div><canvas id="c" width="960" height="600"></canvas></div>
<div id="ov"><div class="bx" id="bx"></div></div>
<script>
const SB_URL='https://lvfhxcmnqylioalsluvy.supabase.co',SB_KEY='sb_publishable_gZ4FF1BgIlhIzK1b4y91bQ_YPw9WfXN';let sb=null;try{if(window.supabase&&!SB_URL.startsWith('SUA_'))sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),GL=310,GR=650,GT=170,GB=300,BX=480,BY=500,TOTAL=5;
if(!x.roundRect)x.roundRect=function(a,b,w,h){this.rect(a,b,w,h)};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let st='aim',res=[],drag=null,sh=null,kp=null,fx=[],tm=0,msg='',rt=0,hint=0,rot=0;
function fire(dx,dy,cu){if(st!='aim')return;const len=Math.min(Math.hypot(dx,dy),330),p=len/330,tx=BX+dx*1.2,ty=325-(len-70)*.9,T=1.15-.55*p;
 const ok=Math.random()<.45,ax=ok?tx+(Math.random()-.5)*90:BX+(Math.random()<.5?-1:1)*(40+Math.random()*120),ay=ok?cl(ty+10,195,265):250;
 sh={tx,ty,T,t:0,cu:cl(cu,-130,130),arc:60*p,p,x:BX,y:BY,s:1};kp={ax,ay,x:BX,y:255};st='fly';msg=''}
function outcome(){const{tx,ty,p}=sh,rx=56*(1-.3*p),ry=58;
 if(tx<GL||tx>GR||ty<GT)return['miss','PRA FORA!'];if(ty>GB+8)return['miss','CHUTE FRACO!'];
 if(((tx-kp.ax)/rx)**2+((ty-kp.ay)/ry)**2<1)return['save','DEFENDEU!'];
 if(tx-GL<10||GR-tx<10||ty-GT<10)return['post','NA TRAVE!'];return['goal','GOL!']}
function update(dt){tm+=dt;rot+=dt*8;
 fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;f.l-=dt});fx=fx.filter(f=>f.l>0);
 if(st=='fly'){sh.t+=dt;const u=Math.min(sh.t/sh.T,1);sh.x=BX+(sh.tx-BX)*u+sh.cu*Math.sin(Math.PI*u);sh.y=BY+(sh.ty-BY)*u-sh.arc*Math.sin(Math.PI*u);sh.s=1-.58*u;
  const k=cl((sh.t-.1)/.45,0,1),e=1-(1-k)*(1-k);kp.x=BX+(kp.ax-BX)*e;kp.y=255+(kp.ay-255)*e;
  if(u>=1){const[o,m]=outcome();sh.o=o;msg=m;res.push(o=='goal'?1:0);st='res';rt=0;if(o=='goal')for(let i=0;i<70;i++)fx.push({x:480,y:200,vx:(Math.random()-.5)*500,vy:-Math.random()*380,l:1.6,c:['#ffd43b','#ff6b6b','#4dabf7','#51cf66','#fff'][i%5]})}}
 else if(st=='res'){rt+=dt;if(rt>1.6){if(res.length>=TOTAL){st='end';finish()}else{st='aim';sh=null;kp=null;msg=''}}}
 else if(st=='aim')hint+=dt}
function ball(X,Y,s){const r=26*s;x.fillStyle='#0003';x.beginPath();x.ellipse(X,Y+r*.9,r*.9,r*.28,0,0,7);x.fill();x.save();x.translate(X,Y);x.rotate(rot);x.fillStyle='#fff';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.strokeStyle='#333';x.lineWidth=1.5;x.stroke();x.fillStyle='#222';x.beginPath();for(let i=0;i<5;i++){const a=i*1.2566;x.lineTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38)}x.fill();for(let i=0;i<5;i++){const a=i*1.2566+.63;x.beginPath();x.arc(Math.cos(a)*r*.82,Math.sin(a)*r*.82,r*.16,0,7);x.fill()}x.restore()}
function draw(){const g=x.createLinearGradient(0,0,0,170);g.addColorStop(0,'#5ec2ff');g.addColorStop(1,'#cdeeff');x.fillStyle=g;x.fillRect(0,0,960,600);
 for(let r=0;r<4;r++)for(let i=0;i<48;i++){x.fillStyle=['#e03131','#ffd43b','#4dabf7','#fff','#51cf66','#cc5de8'][(i*7+r*3)%6];x.beginPath();x.arc(10+i*20+(r%2)*8,40+r*24,8,0,7);x.fill()}
 x.fillStyle='#1c7ed6';x.fillRect(0,135,960,28);x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='left';for(let i=0;i<6;i++)x.fillText('BLIB ⚽',20+i*165,155);
 for(let i=0;i<10;i++){const y0=165+435*Math.pow(i/10,1.7),y1=165+435*Math.pow((i+1)/10,1.7);x.fillStyle=i%2?'#37a043':'#3fae49';x.fillRect(0,y0,960,y1-y0+1)}
 x.strokeStyle='#fffc';x.lineWidth=4;x.beginPath();x.moveTo(60,GB);x.lineTo(900,GB);x.moveTo(190,GB);x.lineTo(60,440);x.lineTo(900,440);x.lineTo(770,GB);x.stroke();x.fillStyle='#fff';x.beginPath();x.ellipse(BX,525,16,5,0,0,7);x.fill();
 const sk=st=='res'&&sh&&sh.o=='goal'?Math.sin(rt*30)*3*Math.max(0,1-rt):0;
 x.fillStyle='#ffffff22';x.fillRect(GL+30,GT+14,GR-GL-60,GB-GT-20);x.strokeStyle='#ffffff77';x.lineWidth=1;x.beginPath();
 for(let i=0;i<=17;i++){const X=GL+30+i*(GR-GL-60)/17+sk;x.moveTo(X,GT+14);x.lineTo(X,GB-6)}for(let i=0;i<=7;i++){const Y=GT+14+i*(GB-GT-20)/7;x.moveTo(GL+30+sk,Y);x.lineTo(GR-30+sk,Y)}
 x.moveTo(GL,GT);x.lineTo(GL+30,GT+14);x.moveTo(GR,GT);x.lineTo(GR-30,GT+14);x.moveTo(GL,GB);x.lineTo(GL+30,GB-6);x.moveTo(GR,GB);x.lineTo(GR-30,GB-6);x.stroke();
 const kx=kp?kp.x:BX+Math.sin(tm*2)*8,ky=kp?kp.y:255;x.save();x.translate(kx,ky);x.rotate((kx-BX)/150*.9);
 x.strokeStyle='#ffd43b';x.lineWidth=14;x.lineCap='round';x.beginPath();x.moveTo(-18,-20);x.lineTo(-40,-48);x.moveTo(18,-20);x.lineTo(40,-48);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(-41,-50,8,0,7);x.arc(41,-50,8,0,7);x.fill();
 x.fillStyle='#ff922b';x.beginPath();x.roundRect(-22,-30,44,56,12);x.fill();x.fillStyle='#1c7ed6';x.fillRect(-18,24,15,30);x.fillRect(3,24,15,30);x.fillStyle='#f1c27d';x.beginPath();x.arc(0,-42,13,0,7);x.fill();x.fillStyle='#222';x.fillRect(-7,-45,4,4);x.fillRect(3,-45,4,4);x.restore();
 if(st=='aim')ball(BX,BY,1);else if(sh){let X=sh.x,Y=sh.y,s=sh.s;if(st=='res'){if(sh.o=='save'){X+=(sh.tx>kp.ax?1:-1)*rt*220;Y+=rt*rt*300-rt*120}else if(sh.o=='miss'){Y-=rt*70;s*=.9}else if(sh.o=='post'){X+=(sh.tx<BX?-1:1)*rt*160;Y+=rt*rt*260}}ball(X,Y,Math.max(.2,s))}
 x.strokeStyle='#fff';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(GL,GB);x.lineTo(GL,GT);x.lineTo(GR,GT);x.lineTo(GR,GB);x.stroke();
 if(drag&&st=='aim'){x.setLineDash([10,8]);x.strokeStyle='#ffd43b';x.lineWidth=5;x.beginPath();drag.pts.forEach((p,i)=>x[i?'lineTo':'moveTo'](p.x,p.y));x.stroke();x.setLineDash([])}
 fx.forEach(f=>{x.fillStyle=f.c;x.fillRect(f.x,f.y,8,5)});
 for(let i=0;i<TOTAL;i++){x.fillStyle=i<res.length?(res[i]?'#2ecc71':'#e03131'):'#bbb';x.beginPath();x.arc(30+i*34,572,12,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}
 x.font='bold 22px "Trebuchet MS"';x.textAlign='left';x.fillStyle='#fff';x.fillText('Gols: '+res.reduce((a,b)=>a+b,0),210,580);
 if(st=='aim'){x.textAlign='center';x.globalAlpha=.6+.4*Math.sin(hint*4);x.font='bold 24px "Trebuchet MS"';x.fillText('Arraste da bola para cima! (força = tamanho, curva = arco do dedo)',480,450);x.globalAlpha=1}
 if(msg&&st=='res'){const s=1+.25*Math.sin(Math.min(rt*6,3.14));x.save();x.translate(480,360);x.scale(s,s);x.font='bold 74px "Trebuchet MS"';x.textAlign='center';x.strokeStyle='#222';x.lineWidth=8;x.fillStyle=sh.o=='goal'?'#51cf66':'#ff6b6b';x.strokeText(msg,0,0);x.fillText(msg,0,0);x.restore()}
 $('inf').textContent='Chute '+Math.min(res.length+(st=='aim'||st=='end'?(st=='end'?0:1):0),TOTAL)+' de '+TOTAL}
async function save(n,g){if(!sb)return 'Ranking indisponível (Supabase não configurado).';const r=await sb.from('blib_rankings').insert({jogo_slug:'penalty',nome_jogador:n,pontuacao:g});return r.error?'Não foi possível salvar: '+r.error.message:''}
async function getTop(){if(!sb)return[];const r=await sb.from('blib_rankings').select('nome_jogador,pontuacao').eq('jogo_slug','penalty').order('pontuacao',{ascending:false}).limit(5);return r.data||[]}
function box(h){$('bx').innerHTML=h;$('ov').classList.add('on')}
function finish(){const g=res.reduce((a,b)=>a+b,0);box('<h2>'+(g>=4?'🏆 Craque!':g>=2?'👏 Muito bem!':'⚽ Continue treinando!')+'</h2><p>Você fez <b>'+g+' gol(s)</b> de '+TOTAL+'</p><input id="nm" maxlength="15" placeholder="Seu apelido"><br><button class="b" id="sv">Salvar no ranking</button><p id="ms"></p>');
 $('sv').onclick=async()=>{const n=$('nm').value.trim().slice(0,15);if(!n){$('ms').textContent='Digite um apelido!';return}$('sv').disabled=true;const e=await save(n,g),l=await getTop();
  const o=document.createElement('ol');l.forEach(r=>{const li=document.createElement('li');li.textContent=r.nome_jogador+' — '+r.pontuacao+' gol(s)';o.appendChild(li)});
  $('bx').innerHTML='<h2>🏆 Top 5 artilheiros</h2>';if(e){const p=document.createElement('p');p.textContent=e;$('bx').appendChild(p)}$('bx').appendChild(o);
  $('bx').insertAdjacentHTML('beforeend','<button class="b" onclick="again()">Jogar novamente</button> <a class="b" href="./index.html">Voltar ao BLIB</a>')}}
function again(){$('ov').classList.remove('on');res=[];st='aim';sh=null;kp=null;fx=[];msg=''}
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height}};
cv.addEventListener('pointerdown',e=>{if(st!='aim')return;cv.setPointerCapture(e.pointerId);drag={pts:[pt(e)]}});
cv.addEventListener('pointermove',e=>{if(drag)drag.pts.push(pt(e))});
cv.addEventListener('pointerup',e=>{if(!drag)return;const p=drag.pts,s=p[0],q=pt(e),m=p[p.length>>1],dx=q.x-s.x,dy=q.y-s.y,ch=Math.hypot(dx,dy)||1;drag=null;
 if(dy>-40){msg='';hint=0;return}fire(dx,dy,((dx*(m.y-s.y)-dy*(m.x-s.x))/ch)*1.1)});
let last=0;function loop(ts){update(Math.min((ts-last)/1000,.1));last=ts;draw();requestAnimationFrame(loop)}requestAnimationFrame(ts=>{last=ts;loop(ts)});
</script></body></html>
