<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desafio da Moto - BLIB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{margin:0;height:100%;background:#1d1b3a;font-family:'Trebuchet MS',sans-serif;color:#fff;overflow:hidden}
#w{width:min(100vw,calc((100vh - 46px)*1.7778));margin:0 auto}
#bar{display:flex;gap:8px;align-items:center;justify-content:space-between;height:46px;font-weight:bold;font-size:15px;white-space:nowrap}
.b{background:#ffd43b;color:#222;border:0;border-radius:18px;padding:8px 14px;font:inherit;text-decoration:none;cursor:pointer;display:inline-block}
canvas{width:100%;display:block;border-radius:10px;background:#8fd3ff}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5}#ov.on{display:flex}
.bx{background:#2b2862;border-radius:20px;padding:20px;width:min(92vw,420px);text-align:center;max-height:92vh;overflow:auto}
.bx input{font:inherit;font-size:20px;padding:10px;border-radius:12px;border:0;width:80%;text-align:center;margin:8px 0}
ol{text-align:left;font-size:18px;padding-left:34px}
</style>
</head>
<body>
<div id="w">
  <div id="bar">
    <a class="b" href="./index.html">← Voltar ao BLIB</a>
    <span id="lv">Fase 1</span>
    <span id="tm">⏱ 0.0s</span>
    <span id="at">Tentativas: 1</span>
    <button class="b" id="rs">Reiniciar (R)</button>
  </div>
  <canvas id="c" width="960" height="540"></canvas>
</div>
<div id="ov"><div class="bx" id="bx"></div></div>

<script>
// Conexão Supabase com tratamento de falhas
const SB_URL='https://lvfhxcmnqylioalsluvy.supabase.co', SB_KEY='sb_publishable_gZ4FF1BgIlhIzK1b4y91bQ_YPw9WfXN';
let sb = null;
try {
  if (window.supabase && SB_URL) {
    sb = window.supabase.createClient(SB_URL, SB_KEY);
  }
} catch(e) { console.log("Supabase off", e); }

const cv = document.getElementById('c'), x = cv.getContext('2d');

// Configurações do Jogo
let lvl = 0, att = 1, tempo = 0, totalTempo = 0, jogando = true, emAcao = true;
let keys = {};

const FASES = [
  { nome: 'Fase 1 - Colinas', fim: 3000 },
  { nome: 'Fase 2 - Rampas Radicais', fim: 4000 }
];

// Cálculo da altura do terreno suave
function getChao(x) {
  return 400 + Math.sin(x / 180) * 40 + Math.cos(x / 400) * 30;
}

// Objeto da Moto
let moto = {
  x: 100,
  y: 300,
  vx: 0,
  vy: 0,
  a: 0,
  va: 0
};

function resetMoto() {
  moto.x = 100;
  moto.y = getChao(100) - 30;
  moto.vx = 0;
  moto.vy = 0;
  moto.a = 0;
  moto.va = 0;
  jogando = true;
}

// Controles
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyR') restart();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
document.getElementById('rs').onclick = restart;

function restart() {
  att++;
  resetMoto();
}

// Loop de Física
function update() {
  if (!jogando) return;

  tempo += 1/60;

  // Aceleração e Freio
  if (keys['ArrowUp'] || keys['KeyW']) moto.vx += 0.25;
  if (keys['ArrowDown'] || keys['KeyS']) moto.vx -= 0.15;

  // Inclinação / Acrobacias
  if (keys['ArrowLeft'] || keys['KeyA']) moto.va -= 0.005;
  if (keys['ArrowRight'] || keys['KeyD']) moto.va += 0.005;

  // Gravidade e atrito
  moto.vy += 0.3;
  moto.vx *= 0.98;
  moto.va *= 0.95;

  moto.x += moto.vx;
  moto.y += moto.vy;
  moto.a += moto.va;

  // Colisão com o solo
  let chaoY = getChao(moto.x);
  if (moto.y >= chaoY - 20) {
    moto.y = chaoY - 20;
    moto.vy = 0;
    moto.vx *= 0.96; // atrito do chão

    // Se bater muito inclinado de cabeça = Morte/Reinício
    let anguloNorm = Math.abs(moto.a % (Math.PI * 2));
    if (anguloNorm > 1.8 && anguloNorm < 4.5) {
      restart();
    } else {
      moto.a *= 0.8; // alinha com o chão
    }
  }

  // Chegada
  if (moto.x >= FASES[lvl].fim) {
    totalTempo += tempo;
    if (lvl < FASES.length - 1) {
      lvl++;
      tempo = 0;
      resetMoto();
    } else {
      jogando = false;
      finalizarJogo();
    }
  }

  // Atualiza placar topo
  document.getElementById('lv').textContent = FASES[lvl].nome;
  document.getElementById('tm').textContent = `⏱ ${tempo.toFixed(1)}s (Total: ${totalTempo.toFixed(1)}s)`;
  document.getElementById('at').textContent = `Tentativas: ${att}`;
}

// Renderização Gráfica
function draw() {
  // Cópia da Câmera
  let camX = moto.x - 200;
  let camY = moto.y - 300;

  // Fundo
  x.fillStyle = '#7ec8ff';
  x.fillRect(0, 0, 960, 540);

  x.save();
  x.translate(-camX, -camY);

  // Desenhar Terreno
  x.fillStyle = '#51cf66';
  x.beginPath();
  x.moveTo(camX - 100, 1000);
  for (let sx = camX - 100; sx <= camX + 1100; sx += 20) {
    x.lineTo(sx, getChao(sx));
  }
  x.lineTo(camX + 1100, 1000);
  x.fill();

  // Linha de Chegada
  let finX = FASES[lvl].fim;
  x.fillStyle = '#fff';
  x.fillRect(finX, getChao(finX) - 100, 10, 100);
  x.fillStyle = '#000';
  x.fillRect(finX + 10, getChao(finX) - 100, 15, 30);

  // Desenhar Moto e Piloto
  x.save();
  x.translate(moto.x, moto.y);
  x.rotate(moto.a);

  // Rodas
  x.fillStyle = '#222';
  x.beginPath(); x.arc(-18, 10, 10, 0, Math.PI*2); x.fill();
  x.beginPath(); x.arc(18, 10, 10, 0, Math.PI*2); x.fill();

  // Corpo da Moto
  x.fillStyle = '#e03131';
  x.fillRect(-15, -5, 30, 10);

  // Piloto
  x.fillStyle = '#ffd43b';
  x.beginPath(); x.arc(0, -18, 7, 0, Math.PI*2); x.fill();

  x.restore();
  x.restore();
}

// Finalização e Ranking
async function finalizarJogo() {
  const box = document.getElementById('bx');
  document.getElementById('ov').classList.add('on');
  
  box.innerHTML = `
    <h2>🏁 Você completou tudo!</h2>
    <p>Tempo Total: <b>${totalTempo.toFixed(2)}s</b></p>
    <input id="nm" maxlength="15" placeholder="Seu apelido"><br>
    <button class="b" id="sv">Salvar no ranking</button>
    <p id="ms"></p>
  `;

  document.getElementById('sv').onclick = async () => {
    const nome = document.getElementById('nm').value.trim();
    if (!nome) return;
    
    if (sb) {
      await sb.from('blib_rankings').insert({
        jogo_slug: 'moto',
        nome_jogador: nome,
        tempo_segundos: +totalTempo.toFixed(2)
      });
    }

    box.innerHTML = `
      <h2>🏆 Mandou muito bem!</h2>
      <p>Pontuação registrada para <b>${nome}</b>.</p>
      <a class="b" href="./index.html">Voltar ao BLIB</a>
    `;
  };
}

// Main Loop
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
resetMoto();
loop();
</script>
</body>
</html>
