function H(x){const p=L.pts;if(x<=p[0][0])return p[0][1];let i=0;while(i<p.length-2&&x>p[i+1][0])i++;const a=p[i],b=p[i+1];if(x>=b[0])return b[1];let t=(x-a[0])/(b[0]-a[0]);if(!b[2])t=(1-Math.cos(Math.PI*t))/2;return a[1]+(b[1]-a[1])*t}
let L,lvl=0,b,t=0,bonus=0,att=1,total=0,state='play',timer=0,parts=[],toastT=0,toastM='',hz=[],tk=0;const down={};

 b.vx+=ax*dt;b.vy+=ay*dt;b.w+=al*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;

 const hx=b.x+4*ca+34*sa,hy=b.y+4*sa-34*ca;if(hy+8>H(hx))return crash();
 const pts=[[b.x+(-26)*ca-16*sa,b.y+(-26)*sa+16*ca,10],[b.x+26*ca-16*sa,b.y+26*sa+16*ca,10],[hx,hy,8],[b.x,b.y,12]];
 for(const h of hz)for(const q of pts)if(Math.hypot(h.x-q[0],h.y-q[1])<h.r*.9+q[2])return crash();

function crash(){if(state!='play')return;state='crash';timer=55;att++;for(let i=0;i<45;i++){const a=Math.random()*6.28,s=80+Math.random()*320;parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,l:.5+Math.random()*.6,c:['#ff6a3d','#ffd43b','#444','#fff'][i%4]})}}
function step(){tk++;if(toastT>0)toastT--;parts.forEach(p=>{p.x+=p.vx/60;p.y+=p.vy/60;p.vy+=15;p.l-=1/60});parts=parts.filter(p=>p.l>0);
 if(state=='play'){t+=1/60;for(let i=0;i<4&&state=='play';i++)sub(1/240)}

 else if(state=='done'){if(--timer<=0){lvl<LV.length-1?load(lvl+1):finish()}}}
let camX=0,camY=0;

 if(!b)return;const tx=b.x-320,ty=b.y-330;camX+=(tx-camX)*.2;camY+=(ty-camY)*.08;
 x.fillStyle='#b6a6e8';x.beginPath();x.moveTo(0,540);for(let s=0;s<=960;s+=20)x.lineTo(s,330+Math.sin((s+camX*.2)/110)*45);x.lineTo(960,540);x.fill();
 x.beginPath();x.moveTo(0,540);for(let s=0;s<=960;s+=8)x.lineTo(s,H(camX+s)-camY);x.lineTo(960,540);x.fillStyle='#8a5a3a';x.fill();
 x.beginPath();for(let s=0;s<=960;s+=8)x[s?'lineTo':'moveTo'](s,H(camX+s)-camY);x.strokeStyle='#51cf66';x.lineWidth=8;x.stroke();
 for(const h of hz){const X=h.x-camX,Y=h.y-camY;if(X<-60||X>1020)continue;if(h.k=='s'){x.fillStyle='#ccc';x.beginPath();x.moveTo(X-10,Y+9);x.lineTo(X,Y-12);x.lineTo(X+10,Y+9);x.fill()}
  else{x.save();x.translate(X,Y);x.rotate(tk/6);x.fillStyle='#9aa';x.beginPath();for(let i=0;i<16;i++){const r=i%2?h.r-6:h.r+3,a=i*Math.PI/8;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.fill();x.fillStyle='#556';x.beginPath();x.arc(0,0,6,0,7);x.fill();x.restore()}}
 const fx=L.fin-camX,fy=H(L.fin)-camY;x.fillStyle='#fff';x.fillRect(fx-3,fy-140,6,140);for(let i=0;i<4;i++)for(let j=0;j<6;j++){x.fillStyle=(i+j)%2?'#fff':'#222';x.fillRect(fx+3+j*10,fy-140+i*10,10,10)}

  x.strokeStyle='#e03131';x.lineWidth=6;x.beginPath();x.moveTo(-26,16);x.lineTo(-4,0);x.lineTo(14,2);x.lineTo(26,16);x.moveTo(14,2);x.lineTo(20,-8);x.stroke();
  x.strokeStyle='#1c7ed6';x.lineWidth=8;x.beginPath();x.moveTo(-4,0);x.lineTo(2,-22);x.stroke();x.lineWidth=5;x.beginPath();x.moveTo(2,-20);x.lineTo(18,-8);x.stroke();

async function save(n,s){if(!sb)return 'Ranking indisponível (Supabase não configurado).';const row=v=>({jogo_slug:'moto',nome_jogador:n,tempo_segundos:v});let r=await sb.from('blib_rankings').insert(row(+s.toFixed(2)));if(r.error)r=await sb.from('blib_rankings').insert(row(Math.round(s)));return r.error?'Não foi possível salvar: '+r.error.message:''}
async function getTop(){if(!sb)return[];const r=await sb.from('blib_rankings').select('nome_jogador,tempo_segundos').eq('jogo_slug','moto').order('tempo_segundos',{ascending:true}).limit(5);return r.data||[]}
